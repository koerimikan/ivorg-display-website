name: Verify

# Git can merge two branches cleanly into a Spec that breaks an L3 invariant
# (e.g. two ssrInitial Issues). This runs the full gate on every PR, before merge.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      IVORG_SITE_URL: https://ivorg.net
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run gate -- P4
      - run: npm run test:workspace
      - run: npm run build
      - run: npm run verify:release
      - run: npm run test:release
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs
          path: .companion/gates/
          if-no-files-found: ignore
          include-hidden-files: true
